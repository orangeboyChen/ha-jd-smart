[project]
name = "ha-jd-smart"
version = "0.0.0"
requires-python = ">=3.13"

[dependency-groups]
test = [
    "pytest-homeassistant-custom-component==0.13.232",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv]
package = false
